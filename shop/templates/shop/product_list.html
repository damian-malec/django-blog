<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mój sklep</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f7f7;
            color: #222;
        }
        h1 { text-align: center; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }
        .price { font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>
    <h1>Mój sklep</h1>
    <p><a href="{% url 'cart_detail' %}">🛒 Zobacz koszyk</a></p>
    <div class="products">
        {% for product in products %}
            <div class="product">
                <h2>{{ product.name }}</h2>
                {% if product.image_url %}
                    <img src="{{ product.image_url }}"
                         alt="{{ product.name }}"
                         style="width:100%;height:180px;object-fit:cover">
                {% endif %}
                <p>{{ product.description }}</p>
                <p class="price">{{ product.price }} zł</p>
                <form method="post" action="{% url 'add_to_cart' product.id %}">
                    {% csrf_token %}
                    <button type="submit">Dodaj do koszyka</button>
                </form>
            </div>
        {% empty %}
            <p>Sklep jest jeszcze pusty. Dodaj pierwszy produkt!</p>
        {% endfor %}
    </div>
</body>
</html>
