<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twój koszyk</title>
</head>
<body>
    <h1>Twój koszyk</h1>

    {% for item in items %}
        <div>
            <h2>{{ item.product.name }}</h2>
            <p>Ilość: {{ item.quantity }}</p>
            <p>Cena: {{ item.product.price }} zł</p>
            <p>Wartość: {{ item.subtotal }} zł</p>
        </div>
        <hr>
    {% empty %}
        <p>Twój koszyk jest pusty.</p>
    {% endfor %}

    <h2>Razem: {{ total }} zł</h2>

    <p><a href="{% url 'product_list' %}">Wróć do sklepu</a></p>
</body>
</html>
