<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}anadig{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .page-heading {
            font-weight: 700;
            letter-spacing: -1px;
        }

        .product-card {
            border: 0;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .btn-dark {
            border-radius: 8px;
        }

        .site-footer {
            border-top: 1px solid #dee2e6;
        }

        .checkout-label {
            display: block;
            margin-bottom: 8px;
            color: #77756f;
            font-size: 12px;
            font-weight: 600;
            text-transform: lowercase;
            letter-spacing: 0.04em;
        }

        .checkout-card {
            max-width: 760px;
            margin: 0 auto;
        }

        .checkout-card .form-control {
            min-height: 48px;
            border: 1px solid #e3e1dc;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            background: #fff;
        }

        .checkout-card .form-control:focus {
            border-color: #77756f;
            box-shadow: 0 0 0 3px rgba(32, 32, 30, 0.07);
        }

        .checkout-card .btn {
            min-height: 48px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-transform: lowercase;
        }

    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">                
            <a class="navbar-brand" href="{% url 'product_list' %}">
                anadig
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link" href="{% url 'product_list' %}">
                    shop
                </a>
                <a class="btn btn-dark btn-sm px-3"
                    href="{% url 'cart_detail' %}">
                    🛒 cart
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer bg-white mt-5 py-4">
        <div class="container text-center text-secondary small">
            © 2026 anadig
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
